# Crate in a container:
#
#   docker compose up -d                # UI on http://localhost:8099
#   open http://localhost:8099/setup    # first start asks for a password
#
# This file runs the image published by .github/workflows/publish.yml. To build
# from this checkout instead, use the development file:
#
#   docker compose -f compose.dev.yaml up --build
#
# Optional overrides (put them in a .env file next to this file, or on the
# command line: `MUSIC_DIR=/srv/music docker compose up -d`).
#
#   HOST_PORT=8099           host port to publish (8080 is often taken)
#   MUSIC_DIR=/media/music   host folder mounted as the library
#   DATA_DIR=./data          settings, saved queue, workspaces, staged files
#   PUID=1000 / PGID=1000    owner of the files that are written
#   AUDIODL_PASSWORD=        set the password here instead of using /setup
#   AUDIODL_GUEST=1          set to 0 to require the password for all downloads
#
# To follow new releases automatically, start the optional Watchtower service:
#
#   docker compose --profile auto-update up -d

name: crate

services:
  crate:
    image: ghcr.io/smoothcli/crate:latest
    container_name: crate
    restart: unless-stopped
    # With --label-enable, Watchtower only recreates containers carrying this.
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${HOST_PORT:-8099}:8080"
    environment:
      AUDIODL_GUEST: "${AUDIODL_GUEST:-1}"
      AUDIODL_PASSWORD: "${AUDIODL_PASSWORD:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - "${MUSIC_DIR:-/media/music}:/media/music"
      - "${DATA_DIR:-./data}:/app/data"

  # Opt-in, hence the profile: the default `docker compose up -d` stays a plain
  # app plus nothing else. Once started, Watchtower polls the registry once a day
  # and recreates `crate` in place when ghcr.io/smoothcli/crate:latest changes,
  # reusing the same mounts and environment. It runs only for containers labeled
  # above, but it still mounts the Docker socket, which is root-equivalent on
  # this host.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: crate-watchtower
    profiles: ["auto-update"]
    restart: unless-stopped
    command: --interval 86400 --cleanup --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
