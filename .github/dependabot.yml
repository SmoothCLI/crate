version: 2

updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for the small bumps, so the queue stays readable.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # React 19 types and the Radix packages move together; a single major
      # bump on its own would not typecheck.
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
